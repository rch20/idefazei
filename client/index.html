<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Ide Fazei - Plataforma de Crescimento e Discipulado</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/api/pwa/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/api/pwa/icon-192.png" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ide Fazei" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Plataforma ministerial completa para igrejas que desejam crescer com propósito, precisão e excelência espiritual." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-loading { align-items: center; background: #f5f0e8; box-sizing: border-box; color: #1e3a5f; display: flex; flex-direction: column; font-family: Inter, sans-serif; inset: 0; justify-content: center; min-height: 100dvh; padding: 24px; position: fixed; text-align: center; z-index: 9999; }
      #app-loading[hidden] { display: none; }
      #app-loading .app-mark { align-items: center; background: #1e3a5f; border-radius: 18px; color: #c9a84c; display: flex; font-size: 28px; height: 64px; justify-content: center; margin-bottom: 18px; width: 64px; }
      #app-loading p { color: #64748b; font-size: 14px; margin: 8px 0 0; }
      #app-loading button { background: #1e3a5f; border: 0; border-radius: 10px; color: #fff; cursor: pointer; font: inherit; margin-top: 20px; padding: 12px 18px; }
    </style>
  </head>
  <body>
    <div id="app-loading" role="status" aria-live="polite">
      <div class="app-mark" aria-hidden="true">✦</div>
      <strong>Carregando Ide Fazei</strong>
      <p id="app-loading-message">Preparando a plataforma ministerial...</p>
      <button id="app-recovery" type="button" hidden>Atualizar aplicação</button>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var loader = document.getElementById("app-loading");
        var message = document.getElementById("app-loading-message");
        var recovery = document.getElementById("app-recovery");
        var recoveryTimer;
        var diagnosticReported = {};
        function clientId() {
          try {
            var existing = sessionStorage.getItem("ide_fazei_diagnostic_client");
            if (existing) return existing;
            var created = "c-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
            sessionStorage.setItem("ide_fazei_diagnostic_client", created);
            return created;
          } catch (_) { return ""; }
        }
        function cleanMessage(value) {
          return String(value || "Falha de inicialização sem mensagem disponível")
            .replace(/https?:\/\/[^\s]+/gi, "[url-removida]")
            .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, "[email-removido]")
            .replace(/bearer\s+[\w.-]+/gi, "[token-removido]")
            .replace(/[\r\n\t]+/g, " ").slice(0, 500);
        }
        window.__ideFazeiReportStartupIssue = function (kind, detail) {
          var key = kind + ":" + cleanMessage(detail);
          if (diagnosticReported[key]) return;
          diagnosticReported[key] = true;
          try {
            fetch("/api/diagnostics/startup", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ kind: kind, message: cleanMessage(detail), path: location.pathname, userAgent: navigator.userAgent, platform: navigator.platform || "", appVersion: "web-bootstrap-v1", clientId: clientId() }),
              keepalive: true,
            }).catch(function () {});
          } catch (_) {}
        };
        window.__ideFazeiReady = function () {
          window.clearTimeout(recoveryTimer);
          if (loader) loader.hidden = true;
        };
        window.__ideFazeiShowRecovery = function () {
          if (message) message.textContent = "Não foi possível concluir o carregamento. Atualize a aplicação para recuperar arquivos em cache.";
          if (recovery) recovery.hidden = false;
        };
        window.__ideFazeiRecover = async function () {
          window.__ideFazeiReportStartupIssue("recovery", "Usuário acionou a recuperação da aplicação");
          if (recovery) { recovery.disabled = true; recovery.textContent = "Atualizando..."; }
          try {
            if ("serviceWorker" in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
            }
            if ("caches" in window) {
              var cacheKeys = await caches.keys();
              await Promise.all(cacheKeys.map(function (key) { return caches.delete(key); }));
            }
          } finally {
            window.location.reload();
          }
        };
        if (recovery) recovery.addEventListener("click", window.__ideFazeiRecover);
        recoveryTimer = window.setTimeout(function () { window.__ideFazeiReportStartupIssue("startup_timeout", "A inicialização excedeu nove segundos"); window.__ideFazeiShowRecovery(); }, 9000);
        window.addEventListener("error", function (event) {
          var target = event && event.target;
          if (target && target !== window) {
            var tagName = String(target.tagName || "").toUpperCase();
            var source = String(target.src || "");
            var isApplicationScript = tagName === "SCRIPT" && (target.type === "module" || /\/assets\/.*\.js(?:\?|$)/.test(source));
            if (!isApplicationScript) return;
            window.__ideFazeiReportStartupIssue("resource_load", "Falha ao carregar o JavaScript principal da aplicação");
          } else {
            var detail = event && event.message ? event.message : "Erro inesperado durante a inicialização";
            window.__ideFazeiReportStartupIssue("error", detail);
          }
          window.__ideFazeiShowRecovery();
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          window.__ideFazeiReportStartupIssue("unhandled_rejection", event && event.reason && event.reason.message ? event.reason.message : String(event && event.reason || "Promessa rejeitada"));
          window.__ideFazeiShowRecovery();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
