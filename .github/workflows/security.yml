name: CI — segurança (dependências + SAST)

# Varredura contínua de segurança:
#  - deps: vulnerabilidades conhecidas (CVE) nas dependências (pnpm audit)
#  - sast: análise estática do código (Semgrep: OWASP Top 10, Node, segredos, TS/JS)
# Roda sob demanda (workflow_dispatch) e toda segunda de manhã. Não bloqueia deploy
# (continue-on-error); serve para enxergar e priorizar. Para tornar bloqueante, troque
# os "|| true" por limiares.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  deps:
    name: Auditoria de dependências (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit — apenas produção (alto/crítico)
        run: pnpm audit --prod --audit-level=high || true
      - name: pnpm audit — relatório completo
        run: pnpm audit --audit-level=low || true

  sast:
    name: Análise estática (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Semgrep
        run: pip install --quiet semgrep
      - name: Semgrep (OWASP Top 10, Node, segredos, TS/JS)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --config p/javascript \
            --config p/typescript \
            --config p/secrets \
            --metrics off \
            --sarif-output semgrep.sarif \
            server shared client/src || true
      - name: Guardar SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
